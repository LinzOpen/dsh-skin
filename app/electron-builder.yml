appId: io.github.linzopen.dsh-skin
productName: dsh-skin
copyright: MIT licensed
directories:
  buildResources: build
  output: ../dist

# 产物名统一写死。不写的话 Linux 会拿 package.json 的 name（@dsh-skin/app）去拼，
# 打出 "@dsh-skin/app-0.1.0.tar.gz" 这种带斜杠的名字。
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# app.asar 里只放程序自己的代码。皮肤放在 asar 外面（extraResources），
# 因为用户要能打开那个目录去看、去改、去照着写自己的皮肤 —— asar 里的东西
# 打不开也改不了，那等于把"皮肤格式是公开的"这件事作废了。
files:
  - src/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../skins
    to: skins
    filter: ["**/*", "!**/palette.json"]

# 没有代码签名证书。下面两个开关让 electron-builder 不去找证书、也不去公证，
# 否则本地和 CI 都会在打包最后一步失败。代价是用户第一次打开要手动放行，
# README 的「第一次打开」一节写了怎么放行。
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  notarize: false
dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  # 名字里必须有 Setup。全局模板会打出 dsh-skin-0.1.0-win-x64.exe，
  # 而同目录还有一个便携版 .zip —— 一个不懂技术的人分不出哪个是"装的那个"。
  # Setup 是 Windows 上人人认得的词，这一个词省掉的求助比任何文档都多。
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 便携版和安装版共用同一个 ~/.dsh-skin，卸载时不删用户自己的皮肤。
  deleteAppDataOnUninstall: false

linux:
  category: Utility
  # 必须显式写。Linux 的 executableName 默认取 package.json 的 name，
  # 而这里是 "@dsh-skin/app" —— 清洗成 "@dsh-skinapp" 之后仍然带 @，
  # AppImage 直接拒绝构建。这条只在 Linux 上炸，macOS 用的是 productName，
  # 所以本机永远发现不了 —— 是在 Docker 里跑打包才暴露的。
  executableName: dsh-skin
  synopsis: 给 Electron 应用和网页界面换皮肤
  description: 皮肤工作室、可换肤外壳，以及一个会拒绝危险皮肤的检查器。
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]

publish: null
