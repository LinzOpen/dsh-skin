name: Release

# 打 tag 才发版：v0.1.0 这样的。
# 手动触发（workflow_dispatch）只构建、不发布，用来在打 tag 之前先确认三个平台都能打出来。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 建 Release 需要

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pack:mac
          - os: windows-latest
            script: pack:win
          - os: ubuntu-latest
            script: pack:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 发出去的包必须是通过检查的。这一步不是形式 ——
      # 带 error 的皮肤打进安装包，用户装上之后只会看到"这套皮肤点了没反应"。
      - name: Gate on checks
        run: npm run check

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # 没有代码签名证书。不关掉的话 electron-builder 会在最后一步去找证书然后失败。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we are about to publish
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # 包没有签名，第一次打开需要手动放行 —— 这段必须出现在下载页上，
          # 否则用户看到"已损坏"就直接删了。
          body: |
            下载对应平台的包。**这些包没有代码签名**（这个项目背后没有付费证书），第一次打开需要手动放行：

            - **macOS** — 右键点应用 → *打开* → *打开*。还是不行就跑
              `xattr -dr com.apple.quarantine "/Applications/dsh-skin.app"`
            - **Windows** — SmartScreen 弹「已保护你的电脑」→ *更多信息* → *仍要运行*

            ---

            The builds below are **not code-signed**. First launch: on macOS right-click → *Open* →
            *Open*; on Windows choose *More info* → *Run anyway* in the SmartScreen prompt.
