name: Feature request
description: 想要一个现在没有的能力
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想做成的事 / What you're trying to do
      description: 请描述**你卡在哪儿**，而不是直接描述你想要的按钮 —— 前者更容易找到更好的解法。
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / What you had in mind
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过什么 / What you tried instead
